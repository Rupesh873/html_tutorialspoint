<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centring content example</title>
    <style>
      .center-text {
         text-align: center;
      }
    </style>
    <!-- note here we are using property of css to centre text
     also that dot "." represents class -->
</head>
<body>
    <p>This text is not in the center.</p>
    <p class="center-text">This text is in the center.</p>
</body>
</html>
